name: bluetooth_spp
description: Bluetooth Classic serial (RFCOMM/SPP) for Android. Discovery, bonding, multiple connections, backpressured writes and typed errors.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbdeldjalilChougui/bluetooth_spp
issue_tracker: https://github.com/AbdeldjalilChougui/bluetooth_spp/issues
topics:
  - bluetooth
  - serial
  - rfcomm
  - obd2
  - android

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.abdeldjalilchougui.bluetooth_spp
        pluginClass: BluetoothSppPlugin
